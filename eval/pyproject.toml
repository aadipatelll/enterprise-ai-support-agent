# Tooling config for the evaluation script. It reuses the backend package, so run it
# with the backend virtual environment: pip install -e "backend[dev]"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "run_eval"]
