# Ollama runs on the host (see README); containers reach it via host.docker.internal.
x-database-url: &database-url postgresql+psycopg://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-support_agent}

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-support_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp_server:
    build: ./mcp_server
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  # One-shot job: embeds data/docs into pgvector. Re-run with: docker compose run --rm ingest
  ingest:
    <<: *backend
    command: ["python", "-m", "app.ingestion"]
    restart: "no"
    environment:
      DATABASE_URL: *database-url
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DOCS_DIR: /data/docs
    volumes:
      - ./data/docs:/data/docs:ro

  backend:
    <<: *backend
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MCP_SERVER_URL: http://mcp_server:8001/mcp
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mcp_server:
        condition: service_started

volumes:
  pgdata:
